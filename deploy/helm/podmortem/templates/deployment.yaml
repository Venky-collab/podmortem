apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: podmortem, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  replicas: 1 # reports are kept in memory; one replica keeps them in one place
  selector:
    matchLabels: { app.kubernetes.io/name: podmortem, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: podmortem, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      serviceAccountName: {{ .Release.Name }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: podmortem
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - serve
            - --addr=:{{ .Values.service.port }}
            - --model={{ .Values.ollama.model }}
            - --ollama-url={{ .Values.ollama.url }}
            - --max-steps={{ .Values.maxSteps }}
            - --dedupe={{ .Values.dedupe }}
            {{- if .Values.watch.enabled }}
            - --watch
            - --namespace={{ .Values.watch.namespace }}
            {{- end }}
          ports:
            - { name: http, containerPort: {{ .Values.service.port }} }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources: {{- toYaml .Values.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/name: podmortem, app.kubernetes.io/instance: {{ .Release.Name }} }
spec:
  selector: { app.kubernetes.io/name: podmortem, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: http, port: {{ .Values.service.port }}, targetPort: http }
