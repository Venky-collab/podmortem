# Four small apps, each broken in a different, realistic way, for podmortem
# to diagnose. They only use busybox (~2 MB) so the demo is light on data.
#   kubectl apply -f demo/broken-apps.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: demo-shop
---
# 1. Crash loop: the app exits because a required env var is missing.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: demo-shop
spec:
  replicas: 1
  selector: { matchLabels: { app: checkout } }
  template:
    metadata: { labels: { app: checkout } }
    spec:
      containers:
        - name: checkout
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "checkout-service v2.3.0 starting"
              echo "loading config from environment"
              if [ -z "$DATABASE_URL" ]; then
                echo "FATAL: DATABASE_URL is not set; cannot connect to orders database" >&2
                exit 1
              fi
              sleep 3600
---
# 2. Out of memory: the app needs more than its 32Mi limit.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: demo-shop
spec:
  replicas: 1
  selector: { matchLabels: { app: cart } }
  template:
    metadata: { labels: { app: cart } }
    spec:
      containers:
        - name: cart
          image: busybox:1.36
          command: ["sh", "-c"]
          args:
            - |
              echo "cart-service warming product cache into memory"
              tail /dev/zero
          resources:
            requests: { memory: 16Mi }
            limits: { memory: 32Mi }
---
# 3. Bad deploy: an image tag that doesn't exist.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog
  namespace: demo-shop
spec:
  replicas: 1
  selector: { matchLabels: { app: catalog } }
  template:
    metadata: { labels: { app: catalog } }
    spec:
      containers:
        - name: catalog
          image: busybox:1.36-typo
          command: ["sleep", "3600"]
---
# 4. Missing config: the pod references a ConfigMap nobody created.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payments
  namespace: demo-shop
spec:
  replicas: 1
  selector: { matchLabels: { app: payments } }
  template:
    metadata: { labels: { app: payments } }
    spec:
      containers:
        - name: payments
          image: busybox:1.36
          command: ["sleep", "3600"]
          envFrom:
            - configMapRef:
                name: payments-config
